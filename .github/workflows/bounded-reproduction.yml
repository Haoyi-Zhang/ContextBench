name: Bounded owned finite-model reproduction
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  finite-transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test finite semantics and retained evidence
        shell: bash
        run: |
          mkdir -p ci-results
          set -o pipefail
          timeout 120s python run_tests.py --output ci-results/test_summary.json 2>&1 | tee ci-results/tests.log
          timeout 60s python audit_literature.py 2>&1 | tee ci-results/literature.log
      - name: Reproduce the full owned finite base corpus
        shell: bash
        run: |
          set -o pipefail
          timeout 600s python reproduce.py --output ci-results/base 2>&1 | tee ci-results/base.log
          timeout 120s python check_results.py ci-results/base 2>&1 | tee ci-results/base-check.log
      - name: Reproduce owned transport fixtures using retained finite applicability inputs
        shell: bash
        run: |
          set -o pipefail
          timeout 120s python reproduce_transport.py --output ci-results 2>&1 | tee ci-results/transport.log
          timeout 60s python check_transport_results.py ci-results 2>&1 | tee ci-results/closure.log
          timeout 30s python verify.py transport examples/transport.json 2>&1 | tee ci-results/verifier.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bounded-finite-transport-evidence
          path: ci-results/
          retention-days: 14
          if-no-files-found: error
